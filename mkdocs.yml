site_name: Historical Hong Kong through a Maritime Lens
site_url: https://kawaiall.github.io/GaryWebsite/
theme:
  name: material 
  custom_dir: docs/overrides
  logo: images/favicon.png
  favicon: images/favicon.png
  palette: 

    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.integrate 
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - announce.dismiss
    - content.code.annotate 
    - header.autohide
    - navigation.path


extra_javascript:
  - js/custom.js
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  #  - assets/js/banner-effect.js

extra_css:
  - css/custom.css
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
#  - assets/css/banner-effect.css

plugins:
  - search

 
nav:
  - Home: index.md   
  - About: 
      - Selected Publications: about/testing.md
  - Publications: publications.md  # 稍后创建这个文件
  - Timeline: timeline.md          # 稍后创建这个文件
  - Database: database.md          # 稍后创建这个文件
  - Blog:
      - Overview: blog/index.md
      - Posts:
          - "Post 1": blog/posts/Hello-World.md
          
